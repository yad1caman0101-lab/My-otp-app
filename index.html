<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mafiya Premium Super App</title>
    <!-- Lucide Icons and Google Fonts Insertion for Premium Interface look -->
    <script src="https://jsdelivr.net"></script>
    <link href="https://googleapis.com" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #07080d;
            --card-bg: rgba(18, 20, 32, 0.7);
            --accent-neon: #00ffcc;
            --accent-glow: rgba(0, 255, 204, 0.3);
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --border-glow: rgba(255, 255, 255, 0.08);
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
        }
        
        body { 
            background-color: var(--bg-dark); 
            color: var(--text-main); 
            overflow-x: hidden;
            background-image: radial-gradient(circle at 50% -20%, #132337 0%, transparent 50%);
            min-height: 100vh;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent-neon); }

        /* Premium Glassmorphic Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 5%;
            background: rgba(7, 8, 13, 0.75);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-glow);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .logo { 
            font-size: 22px; 
            font-weight: 800; 
            color: var(--text-main); 
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .logo span {
            color: var(--accent-neon);
            text-shadow: 0 0 10px var(--accent-glow);
        }
        
        .insta-btn {
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            color: white; 
            padding: 10px 20px; 
            border-radius: 30px; 
            text-decoration: none;
            font-weight: 700; 
            font-size: 13px; 
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); 
            display: flex; 
            align-items: center; 
            gap: 8px;
            box-shadow: 0 4px 15px rgba(220, 39, 67, 0.2);
        }
        
        .insta-btn:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 6px 20px rgba(220, 39, 67, 0.4); 
            letter-spacing: 0.5px;
        }

        /* Dynamic Navigation Tabs */
        .nav-tabs {
            display: flex; 
            justify-content: center; 
            gap: 12px; 
            margin: 30px 0; 
            padding: 0 20px; 
            overflow-x: auto;
            scrollbar-width: none;
        }
        
        .nav-tabs::-webkit-scrollbar { display: none; }
        
        .tab-btn {
            background: var(--card-bg); 
            border: 1px solid var(--border-glow); 
            color: var(--text-muted);
            padding: 14px 26px; 
            border-radius: 30px; 
            cursor: pointer; 
            font-weight: 600; 
            font-size: 14px;
            transition: all 0.3s ease; 
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .tab-btn.active, .tab-btn:hover {
            background: var(--accent-neon); 
            color: #050508; 
            border-color: var(--accent-neon); 
            box-shadow: 0 0 20px var(--accent-glow);
            font-weight: 700;
        }

        /* App Main Content Container */
        .content-section { 
            display: none; 
            padding: 0 5% 60px 5%; 
            animation: fadeIn 0.4s ease-in-out forwards;
        }
        
        .content-section.active { display: block; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Universal Box Design Layout */
        .panel-box {
            background: var(--card-bg); 
            border: 1px solid var(--border-glow); 
            padding: 40px 30px;
            border-radius: 24px; 
            text-align: center; 
            max-width: 750px; 
            margin: 20px auto; 
            backdrop-filter: blur(12px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        .section-title { font-size: 26px; font-weight: 800; margin-bottom: 8px; letter-spacing: -0.5px; }
        .section-desc { color: var(--text-muted); font-size: 15px; margin-bottom: 30px; }

        /* Universal Premium Form Elements */
        .input-group {
            position: relative;
            max-width: 600px;
            margin: 0 auto 20px auto;
        }

        .app-input {
            width: 100%; 
            padding: 16px 24px; 
            background: rgba(0, 0, 0, 0.4); 
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 14px; 
            color: white; 
            font-size: 15px; 
            outline: none;
            transition: all 0.3s ease;
        }
        
        .app-input:focus { 
            border-color: var(--accent-neon); 
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.15);
            background: rgba(0,0,0,0.6);
        }
        
        .action-btn {
            background: var(--accent-neon); 
            color: #050508; 
            padding: 16px 36px; 
            border: none;
            border-radius: 14px; 
            font-weight: 700; 
            cursor: pointer; 
            font-size: 15px; 
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px var(--accent-glow);
        }
        
        .action-btn:hover { 
            box-shadow: 0 6px 25px rgba(0, 255, 204, 0.5);
            transform: translateY(-1px);
        }

        /* 1. Video Downloader Visual Styling */
        #dl-result { margin-top: 25px; transition: all 0.3s ease; }
        .success-dl-btn {
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: #10b981;
            color: white;
            padding: 16px 32px;
            border-radius: 14px;
            font-weight: 700;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
            transition: 0.3s;
        }
        .success-dl-btn:hover {
            background: #059669;
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.5);
        }

        /* 2. Premium Games UI Hub Grid */
        .games-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); 
            gap: 20px; 
            max-width: 1100px;
            margin: 0 auto;
        }
        
        .game-card {
            background: var(--card-bg); 
            border: 1px solid var(--border-glow); 
            border-radius: 20px;
            padding: 25px 20px; 
            text-align: center; 
            cursor: pointer; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
        }
        
        .game-card:hover { 
            transform: translateY(-6px); 
            border-color: var(--accent-neon); 
            box-shadow: 0 12px 25px rgba(0,0,0,0.4), 0 0 15px rgba(0, 255, 204, 0.1); 
        }
        
        .game-icon { 
            font-size: 42px; 
            margin-bottom: 15px; 
            display: inline-block;
            transition: transform 0.3s ease;
        }
        
        .game-card:hover .game-icon { transform: scale(1.15); }
        .game-card h3 { font-size: 16px; font-weight: 700; color: #f8fafc; }
        
        /* 3. Integrated Online Engine Browser Layout */
        .browser-container { 
            background: #0f111a; 
            border-radius: 20px; 
            border: 1px solid var(--border-glow); 
            overflow: hidden; 
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            max-width: 1100px;
            margin: 0 auto;
        }
        
        .browser-bar { 
            background: #161925; 
            padding: 12px 20px; 
            display: flex; 
            gap: 12px; 
            align-items: center; 
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        
        .browser-bar .action-btn { padding: 10px 18px; font-size: 13px; border-radius: 8px; }
        
        .incognito-mode { 
            border: 1px solid #ff0055 !important; 
            box-shadow: 0 0 25px rgba(255, 0, 85, 0.15) !important;
        }
        .incognito-mode .browser-bar { background: #0b0c10; }
        
        .logo-incog { 
            color: #ff0055; 
            font-size: 12px; 
            font-weight: 800; 
            letter-spacing: 1px;
            text-shadow: 0 0 8px rgba(255,0,85,0.4);
        }
        
        .browser-frame { width: 100%; height: 68vh; border: none; background: white; }

        /* 4. Chatbot Advanced Conversation Dock */
        .chat-container { 
            max-width: 700px; 
            margin: 0 auto;
