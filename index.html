<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Network OTP Sync</title>
    <!-- Android Manifest standard meta tags for internet clearance -->
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #0f172a; color: #e2e8f0; padding: 20px; text-align: center; margin: 0; }
        .container { max-width: 420px; margin: 30px auto; background: #1e293b; padding: 25px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #334155; }
        h2 { margin-top: 0; color: #38bdf8; font-size: 24px; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 20px; }
        select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 16px; outline: none; margin-bottom: 15px; }
        button { width: 100%; padding: 14px; border-radius: 8px; border: none; background: #2563eb; color: white; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s ease; }
        button:hover { background: #1d4ed8; }
        .status { margin-top: 15px; font-size: 13px; color: #fbbf24; display: none; }
        .msg-list { text-align: left; background: #0f172a; padding: 15px; border-radius: 10px; margin-top: 25px; max-height: 300px; overflow-y: auto; border: 1px solid #334155; }
        .msg-item { border-bottom: 1px solid #1e293b; padding: 12px 0; font-size: 14px; }
        .msg-item:last-child { border-bottom: none; }
        .sender { color: #38bdf8; font-weight: bold; font-size: 13px; }
        .text { margin: 6px 0; color: #f1f5f9; line-height: 1.4; }
        .time { color: #64748b; font-size: 11px; }
        .otp-badge { background: #10b981; color: white; padding: 2px 6px; border-radius: 4px; font-weight: bold; font-size: 14px; display: inline-block; }
    </style>
</head>
<body>

<div class="container">
    <h2>📲 App Network Sync</h2>
    <p>Select number, send SMS, and press button to check.</p>
    
    <select id="numberSelect">
        <option value="447848426971">🇬🇧 +44 7848 426971 (UK)</option>
        <option value="447848426923">🇬🇧 +44 7848 426923 (UK)</option>
        <option value="3197058025910">🇳🇱 +31 970 580 25910 (Netherlands)</option>
    </select>

    <button onclick="fetchSmsViaBridge()">⚡ Force Sync Inbox</button>
    <div id="statusBox" class="status"></div>

    <div class="msg-list" id="smsContainer">
        <div style="color: #64748b; text-align: center;">Ready to stream active grid...</div>
    </div>
</div>

<script>
    async function fetchSmsViaBridge() {
        const number = document.getElementById('numberSelect').value;
        const container = document.getElementById('smsContainer');
        const statusBox = document.getElementById('statusBox');
        
        statusBox.style.display = "block";
        statusBox.innerText = "⏳ Checking internet and fetching live data...";
        container.innerHTML = `<div style="color: #64748b; text-align: center;">Connecting to secure API...</div>`;

        // Check if device actually has internet
        if (!navigator.onLine) {
            statusBox.innerText = "❌ No Internet Connection! Please turn on Mobile Data/Wi-Fi.";
            container.innerHTML = `<div style="color: #ef4444; text-align: center;">Offline Mode.</div>`;
            return;
        }

        try {
            const targetUrl = 'https://sms-receive.net' + number;
            
            // Using a high-speed secure production bridge to bypass all carrier blocks
            const response = await fetch('https://corsproxy.io/?' + encodeURIComponent(targetUrl));
            
            if (!response.ok) throw new Error("Bridge Down");
            const data = await response.json();

            if (!data || data.length === 0) {
                statusBox.innerText = "❌ No OTP caught yet. Try sending again.";
                container.innerHTML = `<div style="color: #ef4444; text-align: center;">Pool is empty.</div>`;
                return;
            }

            statusBox.innerText = "✅ Network Connected! Inbox Updated.";
            container.innerHTML = ""; 
            
            data.slice(0, 10).forEach(msg => {
                const item = document.createElement('div');
                item.className = 'msg-item';
                let highlightedText = msg.text.replace(/(\b\d{4,6}\b)/g, '<span class="otp-badge">$1</span>');
                
                item.innerHTML = `
                    <div class="sender">✉️ From: ${msg.from}</div>
                    <div class="text">${highlightedText}</div>
                    <div class="time">🕒 ${msg.time_ago}</div>
                `;
                container.appendChild(item);
            });

        } catch (error) {
            statusBox.innerText = "⚠️ Network Congestion. Tap button again to refresh.";
            container.innerHTML = `<div style="color: #ef4444; text-align: center;">Click "Force Sync Inbox" again.</div>`;
            console.error(error);
        }
    }
</script>

</body>
</html>
